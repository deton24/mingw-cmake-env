name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Alpine
        uses: rorgoroth/setup-alpine@develop

      - name: Install Packages
        run: |
          rm /var/cache/apk/*
          apk add 7zip autoconf automake bash ccache clang cmake coreutils curl diffutils g++ gawk gcc gettext-dev git gperf libtool lld llvm llvm-linker-tools make meson musl-dev nasm patch pkgconf po4a py3-jinja2 py3-mako samurai texinfo util-linux-misc yasm
        shell: alpine.sh --root {0}

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
        shell: alpine.sh --root {0}

      - name: Setup CMake
        run: |
          cmake -Bbuild -G Ninja -DCPUTUNE=x86-64-v3 -DOPTIM=O2
        shell: alpine.sh {0}

      - name: Run Build
        run: |
          ninja -C build llvm
          ninja -C build librempeg
        shell: alpine.sh {0}

      - name: Run Packaging
        run: |
          sh run.sh package
          sh run.sh archive
        shell: alpine.sh {0}

      - name: Save Build Logs
        if: always()
        run: |
          mkdir -p logs
          cp -fr $(find build -type f -iname "*-out.log") logs/ || true
          cp -fr $(find build -type f -iname "*-err.log") logs/ || true
        shell: alpine.sh {0}

      - name: Upload Build Logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-logs
          path: logs/

      - name: Upload librempeg Package
        uses: actions/upload-artifact@v7
        with:
          name: librempeg
          path: bin/librempeg-package

      - name: Delete Last Release
        run: gh release delete latest --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sleep
        run: sleep 30s
        shell: alpine.sh {0}

      - name: Upload Releases
        uses: svenstaro/upload-release-action@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/{*.7z,SHA256SUMS}
          tag: latest
          release_name: latest
          overwrite: true
          file_glob: true
          draft: false
          make_latest: true
